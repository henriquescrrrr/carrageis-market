# ============================================================
# Market Plugin - Server Shop Prices Configuration
# ============================================================
# This file contains default prices and per-item overrides.
# Categories and item assignments are in items.yml.
#
# ---- Item ID formats in overrides ----
#
# Format A (simple material):
#   DIAMOND:
#     buy-price: 500
#     sell-price: 150
#
# Format B (minecraft item string — must be quoted):
#   'minecraft:firework_rocket[minecraft:fireworks={flight_duration:3}]':
#     buy-price: 50
#     sell-price: 15
#
# Spread variavel por tier de dificuldade:
#   Farmavel (25%):            itens infinitamente farmaveis
#   Facil nao-farmavel (32.5%): dirt, sand, pedras comuns
#   Normal nao-farmavel (42.5%): blocos do nether/end, prismarine
#   Raro (55%):                diamante, emerald, shulker
#   Ultra-raro (60%):          netherite, nether star, elytra, trident
#
# Ancora: Netherite Block = 50,000 (buy)
# ============================================================

default-prices:
  disabled_op: 0
  building_blocks: 0
  ores_minerals: 0
  farming_vegetation: 0
  food: 0
  mob_drops: 0
  redstone: 0
  decoration: 0
  tools: 0
  combat: 0
  brewing: 0
  dyes_colors: 0
  wood: 0
  transportation: 0
  music_discs: 0
  pottery_archaeology: 0
  banner_patterns: 0
  smithing_templates: 0
  enchantments: 0
  spawn_eggs: 0
  miscellaneous: 0

# ============================================================
# Enchantment Pricing (for Server Market sell bonus)
# ============================================================
# When selling enchanted items to the Server Market, each enchantment
# adds +25% of its store buy price to the sell value.
#
# Format:
#   ENCHANTMENT_NAME:
#     perLevelBuyCents:        (price per level, in cents)
#       1: 100000              (= $1,000.00)
#       2: 200000
#     OR
#     buyCents: 2500000        (flat price for any level, in cents)
#
# If an enchantment is not listed here, its bonus is 0.
# ============================================================
enchant-prices:
  SHARPNESS:
    perLevelBuyCents:
