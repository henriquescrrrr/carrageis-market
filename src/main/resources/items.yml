# ============================================================
# Market Plugin - Server Shop Items Configuration
# ============================================================
# This file defines shop categories and which items belong to each.
#
# ---- Supported item formats ----
#
# Format A (simple material):
#   - DIAMOND
#   - FIREWORK_ROCKET
#
# Format B (minecraft item string with data components):
#   - 'minecraft:firework_rocket[minecraft:fireworks={flight_duration:3}]'
#   - 'minecraft:potion[minecraft:potion_contents={potion:"minecraft:strong_healing"}]'
#
# YAML quotes (single or double) are REQUIRED for Format B to avoid
# YAML parser issues with colons and brackets.
#
# Virtual item IDs (ENCHANTED_BOOK_*, POTION_*, etc.) are also supported
# for backwards compatibility.
# ============================================================

categories:
  disabled_op:
    display-name: "Disabled / OP Items"
    icon: BARRIER
    description: "Items not available in survival shops"
    sell-multiplier: 0
    buy-enabled: false
    sell-enabled: false

  building_blocks:
