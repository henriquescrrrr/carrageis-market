  economy-account-frozen: "&cA tua conta está congelada. As transações estão bloqueadas."
  economy-insufficient-funds: "&cFundos insuficientes. Necessário: {amount}"

  # Mensagens de Anúncios
  listing-created: "&aAnúncio criado com sucesso! ID: #{id}"
  listing-cancelled: "&aAnúncio cancelado. Item devolvido ao armazém."
