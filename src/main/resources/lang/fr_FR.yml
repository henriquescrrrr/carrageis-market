# ============================================
# Market Plugin Language File - French (France)
# ============================================

# Général
prefix: "&8[&6Marché&8] &r"

# Messages Générales
messages:
  no-permission: "&cVous n'avez pas la permission de faire cela."
  player-only: "&cCette commande ne peut être utilisée que par les joueurs."
  reload-success: "&aConfiguration rechargée avec succès !"
  economy-not-found: "&cAucun plugin d'économie trouvé ! Marché désactivé."
  economy-provider-loaded: "&aFournisseur d'économie chargé : {provider}"
  economy-no-provider: "&cAucun fournisseur d'économie disponible ! Installez MultiBank ou Vault."
  economy-account-frozen: "&cVotre compte est gelé. Les transactions sont bloquées."
  economy-insufficient-funds: "&cFonds insuffisants. Requis : {amount}"

  # Messages d'Annonces
  listing-created: "&aAnnonce créée avec succès ! ID : #{id}"
  listing-cancelled: "&aAnnonce annulée. Objet retourné au stockage."
  listing-expired: "&eVotre annonce #{id} a expiré. Objet déplacé vers le stockage."
  listing-purchased: "&aVous avez acheté {item} x{amount} pour {price} !"
  listing-sold: "&aVotre {item} x{amount} a été vendu à {buyer} pour {price} ! Argent déposé sur votre compte."
  listing-limit-reached: "&cVous avez atteint le nombre maximum d'annonces ({max})."
  listing-cooldown: "&cVeuillez attendre {time} avant de créer une autre annonce."
  listing-not-found: "&cAnnonce introuvable ou plus disponible."
  listing-own-item: "&cVous ne pouvez pas acheter votre propre annonce."
  listing-insufficient-funds: "&cVous n'avez pas assez d'argent. Requis : {price}"

  # Messages d'Enchères
  auction-created: "&aEnchère créée avec succès ! ID : #{id}"
  auction-cancelled: "&aEnchère annulée. Objet retourné au stockage."
  auction-ended-winner: "&aFélicitations ! Vous avez remporté l'enchère pour {item} ! Payé : {price}"
  auction-ended-seller: "&aVotre enchère pour {item} est terminée ! Gagnant : {winner}, Gagné : {price}. Argent déposé."
  auction-ended-no-bids: "&eVotre enchère pour {item} s'est terminée sans offres. Objet déplacé vers le stockage."
  auction-limit-reached: "&cVous avez atteint le nombre maximum d'enchères ({max})."
  auction-not-found: "&cEnchère introuvable ou plus disponible."
  auction-own-item: "&cVous ne pouvez pas enchérir sur votre propre enchère."
  auction-bid-placed: "&aVous avez placé une offre de {amount} sur {item} !"
  auction-outbid: "&eVous avez été surenchéri sur {item} ! Nouvelle offre : {amount} par {bidder}"
  auction-bid-too-low: "&cOffre trop basse ! Minimum : {min}"
  auction-insufficient-funds: "&cVous n'avez pas assez d'argent. Requis : {price}"
  auction-buyout: "&aVous avez acheté immédiatement {item} pour {price} !"
  auction-extended: "&eEnchère prolongée de {seconds}s grâce à la protection anti-snipe."

  # Messages de Réclamation
  claim-success: "&aObjet réclamé avec succès !"
  claim-empty: "&eVous n'avez aucun objet à réclamer."
  claim-inventory-full: "&cVotre inventaire est plein ! Veuillez libérer de l'espace."
  claim-all-success: "&a{count} objets réclamés !"
  claim-items: "&eVous avez &6{count}&e objet(s) en attente au marché. Utilisez /market pour les réclamer."

  # Messages de Gains (Paiement Direct)
  earnings-withdrawn: "&aVous avez retiré &6{amount}&a de vos gains. Nouveau solde : &6{balance}&a."
  earnings-empty: "&eVous n'avez aucun gain à retirer."
  earnings-recovered: "&aRécupéré {amount} d'un dépôt échoué précédent. L'argent est sur votre compte."
  item-sold-offline: "&aPendant votre absence : &f{item}&a vendu à &f{buyer}&a pour &f{price}&a. L'argent est sur votre compte."

  # Validation d'Objets
  invalid-item: "&cVeuillez sélectionner un objet valide."
  item-no-longer-available: "&cL'objet sélectionné n'est plus dans votre inventaire."
  item-changed: "&cL'objet sélectionné a changé. Veuillez sélectionner à nouveau."
  quantity-changed: "&cLa quantité disponible a changé. Veuillez vérifier et réessayer."
  blacklisted-item: "&cCe type d'objet n'est pas autorisé sur le marché."
  blacklisted-content: "&cCet objet contient du contenu bloqué."
  dream-item-blocked: "&cCet objet est un objet créatif de BuildersDream et ne peut pas être vendu ou échangé."
  invalid-price: "&cPrix invalide. Intervalle : {min} - {max}"
  invalid-amount: "&cQuantité invalide."
  invalid-duration: "&cDurée invalide."

  # Messages Admin
  admin-listing-removed: "&aAnnonce #{id} supprimée par l'admin."
  admin-auction-cancelled: "&aEnchère #{id} annulée par l'admin."
  admin-reload: "&aConfiguration rechargée."

